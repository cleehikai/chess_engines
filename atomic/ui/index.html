<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomic Lab</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --line: #2c313c;
    --text: #e6e8ec;
    --dim: #8b93a3;
    --light: #b9a68b;
    --dark: #6f5b45;
    --sel: #6b9b4a;
    --last: #7a7233;
    --blast: #d0422e;
    --accent: #7aa2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
  }
  .app { display: flex; gap: 24px; flex-wrap: wrap; max-width: 1000px; }

  /* -- board -- */
  .board-wrap { position: relative; }
  .board {
    display: grid;
    grid-template-columns: repeat(8, var(--sq));
    grid-template-rows: repeat(8, var(--sq));
    --sq: min(11vw, 72px);
    border: 1px solid var(--line);
    border-radius: 4px; overflow: hidden;
    user-select: none;
  }
  .sq {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--sq) * 0.78);
    line-height: 1;
    cursor: default;
  }
  .sq.light { background: var(--light); }
  .sq.dark  { background: var(--dark); }
  .sq.playable { cursor: pointer; }
  .sq.selected::after,
  .sq.lastmove::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
  }
  .sq.lastmove::after { background: var(--last); opacity: .45; }
  .sq.selected::after { background: var(--sel); opacity: .55; }
  .sq .piece { position: relative; z-index: 2; }
  /* White pieces are drawn as the *filled* glyph with a light fill so they
     stay legible on both square colours; outline glyphs vanish on light. */
  .sq .piece.w { color: #f4f1ec; text-shadow: 0 0 2px #000, 0 1px 2px #0008; }
  .sq .piece.b { color: #1a1a1a; text-shadow: 0 0 2px #fff3; }

  .hint {
    /* Centred explicitly: an absolutely positioned child of a flex container
       falls back to its static position, which is not the square's centre. */
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 3; pointer-events: none;
    width: 30%; height: 30%; border-radius: 50%;
    background: rgba(0,0,0,.32);
  }
  .hint.capture {
    width: 92%; height: 92%; border-radius: 50%;
    background: none; border: calc(var(--sq) * 0.08) solid rgba(0,0,0,.32);
  }
  .sq.blast { animation: boom .7s ease-out; }
  @keyframes boom {
    0%   { box-shadow: inset 0 0 0 0 var(--blast); background: var(--blast); }
    100% { box-shadow: inset 0 0 0 0 transparent; }
  }
  .coord {
    position: absolute; font-size: 10px; font-weight: 600;
    opacity: .55; z-index: 4; pointer-events: none;
  }
  .coord.file { right: 3px; bottom: 1px; }
  .coord.rank { left: 3px; top: 1px; }

  /* -- side panel -- */
  .panel { width: 300px; display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 14px;
  }
  h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: .3px; }
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--dim); margin: 0 0 10px; font-weight: 600;
  }
  .sub { color: var(--dim); font-size: 12px; margin: 0; }
  .elo { font-size: 22px; font-weight: 600; color: var(--accent); }
  .elo.unmeasured { color: var(--dim); font-size: 14px; font-weight: 400; }
  .caveat { color: var(--dim); font-size: 11px; margin-top: 8px; }
  select, button {
    font: inherit; color: var(--text);
    background: #262b34; border: 1px solid var(--line);
    border-radius: 4px; padding: 7px 10px; width: 100%;
  }
  button { cursor: pointer; }
  button:hover { background: #2f3542; }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  label:first-of-type { margin-top: 0; }

  #status { font-weight: 600; }
  #status.thinking { color: var(--dim); font-weight: 400; }
  #status.over { color: var(--accent); }

  .moves {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 12px; max-height: 190px; overflow-y: auto;
    display: grid; grid-template-columns: 2.2em 1fr 1fr; gap: 1px 8px;
  }
  .moves .n { color: var(--dim); }
  .moves .boom { color: var(--blast); }

  /* -- promotion -- */
  .promo-backdrop {
    position: fixed; inset: 0; background: #000a; z-index: 10;
    display: flex; align-items: center; justify-content: center;
  }
  .promo { background: var(--panel); border: 1px solid var(--line);
           border-radius: 6px; padding: 16px; text-align: center; }
  .promo .row { margin-top: 10px; }
  .promo button { font-size: 30px; padding: 6px 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="panel">
    <div class="card">
      <h1>Atomic Lab</h1>
      <p class="sub" id="engine-name">loading…</p>
    </div>

    <div class="card">
      <h2>Opponent</h2>
      <div class="elo" id="elo">—</div>
      <p class="sub" id="elo-detail"></p>
      <label for="level">Strength</label>
      <select id="level"></select>
      <label for="side">You play</label>
      <select id="side">
        <option value="white">White</option>
        <option value="black">Black</option>
      </select>
      <div class="row" style="margin-top:12px">
        <button id="new">New game</button>
        <button id="flip">Flip</button>
      </div>
      <p class="caveat" id="caveat"></p>
    </div>

    <div class="card">
      <h2>Status</h2>
      <div id="status">—</div>
    </div>

    <div class="card">
      <h2>Moves</h2>
      <div class="moves" id="moves"></div>
    </div>
  </div>
</div>

<div class="promo-backdrop" id="promo-backdrop" hidden>
  <div class="promo">
    <div>Promote to</div>
    <div class="row" id="promo-buttons"></div>
  </div>
</div>

<script>
const GLYPH = {
  P: "♙", N: "♘", B: "♗", R: "♖", Q: "♕", K: "♔",
  p: "♟", n: "♞", b: "♝", r: "♜", q: "♛", k: "♚",
};
const FILES = "abcdefgh";

const el = {
  board: document.getElementById("board"),
  status: document.getElementById("status"),
  moves: document.getElementById("moves"),
  level: document.getElementById("level"),
  side: document.getElementById("side"),
  elo: document.getElementById("elo"),
  eloDetail: document.getElementById("elo-detail"),
  engineName: document.getElementById("engine-name"),
  caveat: document.getElementById("caveat"),
  promoBackdrop: document.getElementById("promo-backdrop"),
  promoButtons: document.getElementById("promo-buttons"),
};

let state = null;      // last server state
let info = null;       // /api/info
let flipped = false;
let selected = null;   // square name
let busy = false;
let history = [];      // {uci, san-ish, exploded}

const api = async (path, body) => {
  const res = await fetch(path, body === undefined
    ? {}
    : { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body) });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
};

/* ---------- rendering ---------- */

function parseFen(fen) {
  const rows = fen.split(" ")[0].split("/");
  const board = {};
  rows.forEach((row, i) => {
    let file = 0;
    for (const ch of row) {
      if (ch >= "1" && ch <= "8") { file += +ch; continue; }
      board[FILES[file] + (8 - i)] = ch;
      file++;
    }
  });
  return board;
}

function render() {
  if (!state) return;
  const pieces = parseFen(state.fen);
  const ranks = flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
  const files = flipped ? [...FILES].reverse() : [...FILES];
  const lastFrom = state.last ? state.last.slice(0, 2) : null;
  const lastTo = state.last ? state.last.slice(2, 4) : null;
  const targets = selected ? (state.legal[selected] || []) : [];
  const targetSquares = new Set(targets.map(m => m.slice(2, 4)));

  el.board.textContent = "";
  ranks.forEach((rank, r) => files.forEach((file, f) => {
    const name = file + rank;
    const sq = document.createElement("div");
    sq.className = "sq " + ((r + f) % 2 === 0 ? "light" : "dark");
    sq.dataset.square = name;

    if (name === lastFrom || name === lastTo) sq.classList.add("lastmove");
    if (name === selected) sq.classList.add("selected");
    // Blast squares are re-added on each render, so the animation only fires
    // for the move that just happened.
    if (state.blast.includes(name)) sq.classList.add("blast");

    const piece = pieces[name];
    if (piece) {
      const span = document.createElement("span");
      span.className = "piece " + (piece === piece.toUpperCase() ? "w" : "b");
      span.textContent = GLYPH[piece];
      sq.append(span);
    }
    if (targetSquares.has(name)) {
      const hint = document.createElement("div");
      hint.className = "hint" + (piece ? " capture" : "");
      sq.append(hint);
    }
    if (myTurn() && state.legal[name]) sq.classList.add("playable");

    if (f === 0) sq.append(coord("rank", rank));
    if (r === 7) sq.append(coord("file", file));
    el.board.append(sq);
  }));
}

function coord(kind, text) {
  const d = document.createElement("div");
  d.className = "coord " + kind;
  d.textContent = text;
  return d;
}

function myTurn() {
  return state && !state.over && !busy && state.turn === el.side.value;
}

function renderMoves() {
  el.moves.textContent = "";
  for (let i = 0; i < history.length; i += 2) {
    const n = document.createElement("div");
    n.className = "n";
    n.textContent = (i / 2 + 1) + ".";
    el.moves.append(n);
    for (const entry of [history[i], history[i + 1]]) {
      const d = document.createElement("div");
      if (entry) {
        d.textContent = entry.uci + (entry.exploded ? " ✹" : "");
        if (entry.exploded) d.className = "boom";
      }
      el.moves.append(d);
    }
  }
  el.moves.scrollTop = el.moves.scrollHeight;
}

function setStatus(text, cls = "") {
  el.status.textContent = text;
  el.status.className = cls;
}

function describeResult() {
  const you = el.side.value === "white" ? "1-0" : "0-1";
  if (state.result === "1/2-1/2") return "Draw.";
  return state.result === you ? "You win." : "Engine wins.";
}

function updateStatus() {
  if (!state) return;
  if (state.over) { setStatus(describeResult(), "over"); return; }
  if (busy) { setStatus("Engine thinking…", "thinking"); return; }
  const check = state.check ? " — check" : "";
  setStatus(myTurn() ? "Your move" + check : "Engine to move" + check);
}

/* ---------- interaction ---------- */

el.board.addEventListener("click", (event) => {
  const sq = event.target.closest(".sq");
  if (!sq || !myTurn()) return;
  const name = sq.dataset.square;

  if (selected) {
    const matches = (state.legal[selected] || []).filter(m => m.slice(2, 4) === name);
    if (matches.length > 1) { askPromotion(matches); return; }
    if (matches.length === 1) { play(matches[0]); return; }
  }
  selected = state.legal[name] ? name : null;
  render();
});

function askPromotion(moves) {
  el.promoButtons.textContent = "";
  const white = el.side.value === "white";
  for (const uci of moves) {
    const role = uci[4];
    const btn = document.createElement("button");
    btn.textContent = GLYPH[white ? role.toUpperCase() : role];
    btn.onclick = () => { el.promoBackdrop.hidden = true; play(uci); };
    el.promoButtons.append(btn);
  }
  el.promoBackdrop.hidden = false;
}

async function play(uci) {
  selected = null;
  busy = true;
  updateStatus();
  try {
    const next = await api("/api/move", { fen: state.fen, move: uci });
    record(uci, next);
    state = next;
    render();
    if (!state.over) await engineMove();
  } catch (err) {
    setStatus("Error: " + err.message);
  } finally {
    busy = false;
    render();
    updateStatus();
  }
}

async function engineMove() {
  updateStatus();
  const nodes = +el.level.value;
  const next = await api("/api/engine", { fen: state.fen, nodes });
  if (next.last) record(next.last, next);
  state = next;
  render();
}

function record(uci, next) {
  history.push({ uci, exploded: next.blast.length > 0 });
  renderMoves();
}

async function newGame() {
  busy = true;
  selected = null;
  history = [];
  renderMoves();
  state = await api("/api/new", {});
  busy = false;
  render();
  updateStatus();
  if (el.side.value === "black") {
    busy = true;
    updateStatus();
    try { await engineMove(); } finally { busy = false; render(); updateStatus(); }
  }
}

/* ---------- boot ---------- */

function fillLevels() {
  el.level.textContent = "";
  for (const level of info.levels) {
    const opt = document.createElement("option");
    opt.value = level.nodes;
    opt.textContent = `${level.label} — ${level.nodes.toLocaleString()} nodes`;
    el.level.append(opt);
  }
  el.level.value = String(info.levels[info.levels.length - 1].nodes);
  showElo();
}

function showElo() {
  const level = info.levels.find(l => String(l.nodes) === el.level.value);
  el.elo.textContent = level.elo;
  el.elo.className = "elo" + (level.measured ? "" : " unmeasured");
  el.eloDetail.textContent = level.measured
    ? `${level.nodes.toLocaleString()} nodes per move`
      + (level.anchor ? " — anchors the scale" : "")
    : "Run: lab.cli levels";
}

document.getElementById("new").onclick = newGame;
document.getElementById("flip").onclick = () => {
  flipped = !flipped;
  render();
};
el.level.onchange = showElo;
el.side.onchange = () => {
  flipped = el.side.value === "black";
  newGame();
};

(async () => {
  info = await api("/api/info");
  el.engineName.textContent = `${info.engine} — ${info.terms.join(", ")}`;
  el.caveat.textContent = info.calibrated
    ? "Elo is on this project's internal scale, anchored by pinning "
      + "Fairy-Stockfish at 64k nodes to 2000. Only differences are meaningful; "
      + "do not compare to Lichess ratings."
    : "The ladder is not calibrated — run lab.cli calibrate first.";
  fillLevels();
  await newGame();
})();
</script>
</body>
</html>
