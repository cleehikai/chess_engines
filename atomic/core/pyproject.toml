[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "atomic-core"
version = "0.1.0"
description = "Fast atomic chess core (shakmaty + PyO3) for the atomic lab"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "atomic_core"
