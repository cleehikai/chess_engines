<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomic — play</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="top">
  <div class="brand">Atomic <small id="engine-name"></small></div>
  <nav class="tabs"><a class="active" href="/">Play</a></nav>
  <div class="health" id="health"></div>
</header>

<main>
  <div class="view-title">
    <h1>Play</h1>
    <div class="sub">atomic, against the lab engine</div>
  </div>
  <p class="lede">
    The board is the referee’s: every move you make is checked against the
    perft-tested atomic rules on the server, and the engine answers on the same
    calibrated ladder the rest of the project is measured on.
  </p>

  <div class="split">
    <div class="wide" style="flex:0 0 auto">
      <div class="round">
        <div class="player" id="player-top"></div>
        <div id="board-host" class="board-lg"></div>
        <div class="player" id="player-bottom"></div>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <h2>Status</h2>
        <div class="verdict" id="status" aria-live="polite">—</div>
        <div class="sub" id="status-detail"></div>
      </div>

      <div class="card">
        <h2>Opponent</h2>
        <div class="sub" id="elo">—</div>
        <label class="field" for="level">Strength</label>
        <select id="level"></select>
        <label class="field" for="side" style="margin-top:10px">You play</label>
        <select id="side">
          <option value="white">White</option>
          <option value="black">Black</option>
        </select>
        <div class="row" style="margin-top:12px">
          <button id="new" class="primary wide">New game</button>
          <button id="flip" class="ghost wide">Flip</button>
        </div>
        <p class="caveat sub" id="caveat" style="margin-top:10px"></p>
      </div>

      <div class="card">
        <h2>Moves</h2>
        <div class="movelist" id="moves"></div>
      </div>
    </div>
  </div>
</main>

<script type="module">
import { Board } from "/board.js";

const $ = (id) => document.getElementById(id);
const el = {
  engineName: $("engine-name"),
  health: $("health"),
  status: $("status"),
  statusDetail: $("status-detail"),
  moves: $("moves"),
  level: $("level"),
  side: $("side"),
  elo: $("elo"),
  caveat: $("caveat"),
  playerTop: $("player-top"),
  playerBottom: $("player-bottom"),
};

let info = null;
let state = null;
let busy = false;
let history = [];

const board = new Board($("board-host"), { onMove: (uci) => play(uci) });

const api = async (path, body) => {
  const res = await fetch(path, body === undefined
    ? {}
    : { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body) });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
};

const titleCase = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function currentLevel() {
  return info.levels.find((level) => String(level.nodes) === el.level.value)
    || info.levels[0];
}

function myTurn() {
  return state && !state.over && !busy && state.turn === el.side.value;
}

/* ---------- player bars ---------- */

function fillPlayer(node, name, meta, colour) {
  node.textContent = "";
  const who = document.createElement("div");
  who.className = "who";
  const dot = document.createElement("span");
  dot.className = "dot" + (colour === "black" ? " black" : "");
  const label = document.createElement("span");
  label.className = "name";
  label.textContent = name;
  who.append(dot, label);
  const note = document.createElement("div");
  note.className = "meta";
  note.textContent = meta;
  node.append(who, note);
}

function updatePlayers() {
  const level = currentLevel();
  const you = el.side.value;
  const engine = you === "white" ? "black" : "white";
  fillPlayer(el.playerTop, info.engine,
    `${level.label} · ${level.elo}`, engine);
  fillPlayer(el.playerBottom, "You", titleCase(you), you);
}

/* ---------- status and moves ---------- */

function setStatus(text, cls = "verdict") {
  el.status.textContent = text;
  el.status.className = cls;
}

function describeResult() {
  if (state.result === "1/2-1/2") return "Draw.";
  const you = el.side.value === "white" ? "1-0" : "0-1";
  return state.result === you ? "You win." : "Engine wins.";
}

function updateStatus() {
  if (!state) return;
  if (state.over) { setStatus(describeResult(), "verdict done"); }
  else if (busy) { setStatus("Engine thinking…", "verdict"); }
  else {
    const check = state.check ? " — check" : "";
    setStatus((myTurn() ? "Your move" : "Engine to move") + check);
  }
  el.statusDetail.textContent = state.last
    ? `Last move: ${state.san || state.last}`
    : "White to move.";
}

function renderMoves() {
  el.moves.textContent = "";
  for (let i = 0; i < history.length; i += 2) {
    const n = document.createElement("div");
    n.className = "n";
    n.textContent = `${i / 2 + 1}.`;
    el.moves.append(n);
    for (const entry of [history[i], history[i + 1]]) {
      const d = document.createElement("div");
      d.className = "mv";
      if (entry) d.textContent = entry.san + (entry.exploded ? " ✹" : "");
      el.moves.append(d);
    }
  }
  el.moves.scrollTop = el.moves.scrollHeight;
}

function record(uci, next) {
  history.push({ san: next.san || uci, exploded: next.blast.length > 0 });
  renderMoves();
}

/* ---------- game ---------- */

async function play(uci) {
  if (!myTurn()) return;
  busy = true;
  board.setFrozen(true);
  updateStatus();
  let error = null;
  try {
    const next = await api("/api/move", { fen: state.fen, move: uci });
    record(uci, next);
    state = next;
    board.setState(state);
    busy = false;
    if (!state.over) await engineMove();
  } catch (err) {
    error = err;
  } finally {
    busy = false;
    board.setFrozen(false);
    if (error) setStatus("Error: " + error.message, "verdict wrong");
    else updateStatus();
  }
}

async function engineMove() {
  busy = true;
  board.setFrozen(true);
  updateStatus();
  let error = null;
  try {
    const level = currentLevel();
    const next = await api("/api/engine", { fen: state.fen, nodes: level.nodes });
    if (next.last) record(next.last, next);
    state = next;
    board.setState(state);
  } catch (err) {
    error = err;
  } finally {
    busy = false;
    board.setFrozen(false);
    if (error) setStatus("Error: " + error.message, "verdict wrong");
    else updateStatus();
  }
}

async function newGame() {
  history = [];
  renderMoves();
  busy = true;
  board.setFrozen(true);
  updateStatus();
  let error = null;
  try {
    state = await api("/api/new", {});
    board.setFlipped(el.side.value === "black");
    board.setState(state);
  } catch (err) {
    error = err;
  } finally {
    busy = false;
    board.setFrozen(false);
    if (error) setStatus("Error: " + error.message, "verdict wrong");
    else updateStatus();
    updatePlayers();
  }
  if (state && !state.over && state.turn !== el.side.value) {
    await engineMove();
  }
}

/* ---------- boot ---------- */

function fillLevels() {
  el.level.textContent = "";
  for (const level of info.levels) {
    const opt = document.createElement("option");
    opt.value = level.nodes;
    opt.textContent = `${level.label} — ${level.nodes.toLocaleString()} nodes`;
    el.level.append(opt);
  }
  el.level.value = String(info.levels[info.levels.length - 1].nodes);
}

function showLevel() {
  const level = currentLevel();
  el.elo.textContent = `${level.elo} · ${level.nodes.toLocaleString()} nodes per move`;
  el.elo.className = "sub" + (level.measured ? "" : " faint");
  updatePlayers();
}

$("new").onclick = newGame;
$("flip").onclick = () => board.setFlipped(!board.flipped);
el.level.onchange = showLevel;
el.side.onchange = newGame;

(async () => {
  try {
    info = await api("/api/info");
    el.engineName.textContent = info.engine;
    el.health.textContent = info.calibrated ? "calibrated" : "not calibrated";
    el.health.classList.toggle("warn", !info.calibrated);
    el.caveat.textContent = info.calibrated
      ? "Elo is on this project’s internal scale, anchored by pinning "
        + "Fairy-Stockfish at 64k nodes to 2000. Only differences are "
        + "meaningful; do not compare to Lichess ratings."
      : "The ladder is not calibrated — run lab.cli levels first.";
    fillLevels();
    showLevel();
    await newGame();
  } catch (err) {
    setStatus("Could not reach the server: " + err.message, "verdict wrong");
  }
})();
</script>
</body>
</html>
